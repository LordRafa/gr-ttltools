id: ttltools_tpms
label: tpms
category: '[ttltools]/GUI Widgets/qt'

templates:
  imports: from gnuradio import ttltools
  make: |-
      <%
          win = 'self._%s_win'%id
      %>\
      ${win} = ttltools.Tpms_QT()
      self._${id} = ${win}
      ${gui_hint() % win}

parameters:
-   id: gui_hint
    label: GUI Hint
    dtype: gui_hint
    hide: part

inputs:
-   id: in
    domain: message
    dtype: message

outputs:
file_format: 1
